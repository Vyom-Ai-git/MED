version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: labos_db_container
    restart: always
    environment:
      POSTGRES_DB: labos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labos_backend_container
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/labos_db
      - JWT_SECRET=supersecretchangeinproduction1234567890abc
      - ENVIRONMENT=development
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labos_frontend_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
